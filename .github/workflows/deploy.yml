name: Deploy to Cloudflare Workers

# 自动部署：push 到 main 分支即触发；也可在 Actions 页面手动 Run workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 最小权限：仅读取仓库内容即可完成构建与部署
permissions:
  contents: read

# 需要的 Secrets:
#   CF_API_TOKEN   - Cloudflare API Token（权限：Workers Scripts Edit）
#   CF_ACCOUNT_ID  - Cloudflare Account ID
# 可选 Variables:
#   CF_PLAN        - 设为 free 时改用 wrangler.free.toml（免费计划部署）
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # .npmrc 已声明 legacy-peer-deps（见文件内注释）；ci 失败时回退 install 保证能出包
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # 免费计划（Free）不支持 Analytics Engine 与自定义 cpu_ms，
      # 需改用 wrangler.free.toml。在仓库 Settings → Variables 里设 CF_PLAN=free 即可切换。
      - name: Resolve wrangler config
        id: cfg
        run: echo "args=${{ vars.CF_PLAN == 'free' && '--config wrangler.free.toml' || '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy ${{ steps.cfg.outputs.args }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
